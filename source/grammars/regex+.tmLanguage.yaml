$schema: https://json.schemastore.org/tmlanguage.json
name: Regexp+
scopeName: text.regexplus

patterns:
  - include: '#all'

repository:
  all:
    patterns:
      # Matching escaped tokens first eliminates the need for look-behinds in subsequent patterns.
      - include: '#token-escape'

      - include: '#character-escape'
      - include: '#line-comment'
      - include: '#boundary-assertion'
      - include: '#disjunction'
      - include: '#wildcard'
      - include: '#quantifier'
      - include: '#character-class-escape'
      - include: '#unicode-character-class-escape'
      - include: '#character-class'
      - include: '#backreference'
      - include: '#modifiers'
      - include: '#group'

      # Anything that didn't match before is a literal character.
      - match: \S
        name: string.regexp

  token-escape:
    match: '(?x)\\[ \\ \[ \] () {} # | ^ $ / ]'
    name: constant.character.escape.regexplus

  character-escape:
    patterns:
      - match: \\(?:[fnrtv]|0(?!\d))
        name: constant.character.escape.regexplus
      - match: \[\\b\]
        name: constant.character.escape.regexplus
      - match: \\c[a-zA-Z]
        name: constant.character.escape.regexplus
      - match: (\\x)([a-fA-F0-9]{2})
        captures:
          1: { name: constant.character.escape.regexplus }
          2: { name: constant.numeric.regexplus }
      - match: (\\u\{)([a-fA-F0-9]{1,6})(\})
        captures:
          1: { name: constant.character.escape.regexplus }
          2: { name: constant.numeric.regexplus }
          3: { name: constant.character.escape.regexplus }
      - match: (\\u)([a-fA-F0-9]{4})
        captures:
          1: { name: constant.character.escape.regexplus }
          2: { name: constant.numeric.regexplus }

  line-comment:
    # https://github.com/slevithan/regex/tree/main#flag-x
    match: '#[^\n]*'
    name: comment.line.number-sign.regexplus

  boundary-assertion:
    match: \^|\$|\\[bB]
    name: constant.language.regexplus

  disjunction:
    match: \|
    name: keyword.operator.or.regexp    # Same as TS/JS

  wildcard:
    match: \.
    name: keyword.operator.or.regexp    # Same as TS/JS's |

  quantifier:
    # https://github.com/slevithan/regex/tree/main#possessive-quantifiers
    patterns:
      - match: '[*?+][?+]?'
        name: meta.quantifier.regexplus
        captures:
          0: { name: keyword.operator.quantifier.regexp }   # Same as TS/JS
      - begin: \{
        end: \}[?+]?
        name: meta.quantifier.regexplus
        captures:
          0: { name: keyword.operator.quantifier.regexp }   # Same as TS/JS
        patterns:
          # Matches the '{,y}' form.
          - match: (,)\s*(\d+)(?=\s*\})
            captures:
              1: { name: keyword.operator.separator.regexplus }
              2: { name: constant.numeric.regexplus }
          # Matches the '{x,}' and '{x,y}' forms.
          - match: (\d+)\s*(?:(,)\s*(\d*))?(?=\s*\})
            captures:
              1: { name: constant.numeric.regexplus }
              2: { name: keyword.operator.separator.regexplus }
              3: { name: constant.numeric.regexplus }
          - match: \S
            name: invalid.illegal

  character-class-escape:
    match: \\[sSdDwW]
    name: support.class.regexplus

  # https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Regular_expressions/Unicode_character_class_escape
  unicode-character-class-escape:
    begin: \\[pP]\{(?=[^\n]*\})     # Enforce single line despite the begin/end construct
    end: \}
    name: support.class.regexplus
    contentName: string.regexplus   # For themes that don't support support.property-name/value
    patterns:
      # Matches {LoneProperty}
      - match: \w+(?=\})
        captures:
          0: { name: support.property-value }
      # Matches {property=value}
      - match: (\w+)(=)(\w+)(?=\})
        captures:
          1: { name: support.property-name }
          2: { name: keyword.operator.assignment }
          3: { name: support.property-value }
      - match: '[^}]'
        name: invalid.illegal

  character-class:
    begin: \[\s*(\^)?
    end: \]
    name: meta.character-class.regexplus
    contentName: string.regexp
    captures:
      0: { name: punctuation.definition.character-class.regexp }  # Same as TS/JS
    patterns:
      - include: '#token-escape'
      - include: '#character-escape'
      - include: '#character-class-escape'  # Note: no unicode, \p is not valid inside character classes.
      - match: \\[pP]
        name: invalid.illegal
      - begin: \\q\{
        end: \}
        name: punctuation.definition.character-class.regexp
        contentName: string.regexp
        patterns:
          - include: '#token-escape'
          - include: '#character-escape'
          - include: '#disjunction'
      - match: --|&&
        name: keyword.operator.or.regexp    # Same as TS/JS's |
      - include: '#quantifier'
      - include: '#character-class'         # Recursive

  backreference:
    patterns:
      - match: (\\[1-9](?=\D))
        name: variable.other.regexplus
      - match: (\\k<)([$_\p{IDS}][$\u200C\u200D\p{IDC}]*)?(>)
        captures:
          1: { name: keyword.other.regexplus }
          2: { name: variable.other.regexplus }
          3: { name: keyword.other.regexplus }
      - match: (\\g<)([$_\p{IDS}][$\u200C\u200D\p{IDC}]*)?(>)
        captures:
          1: { name: keyword.other.regexplus }
          2: { name: entity.name.function.regexplus }
          3: { name: keyword.other.regexplus }

  modifiers:
    begin: (\(\?)(?=[-ims]+[^\n]*\))     # Enforce single line despite the begin/end construct
    end: (\))
    name: meta.group.modifiers.regexplus
    captures:
      1: { name: punctuation.definition.group.regexp }
    patterns:
      # Matches the '-ims' form.
      - match: (-[ims]+)([^ims)]*)
        captures:
          1: { name: constant.language.regexplus }
          2: { name: invalid.illegal }
      # Matches the 'ims' and 'ims-ims' forms.
      - match: ([ims]+)(-[ims]+)?([^)]*)
        captures:
          1: { name: constant.language.regexplus }
          2: { name: constant.language.regexplus }
          3: { name: invalid.illegal }

  group:
    patterns:
      - include: '#atomic-group'
      - include: '#look-around'
      - include: '#non-capturing-group'
      - include: '#named-capturing-group'
      - include: '#subroutine-definition-group'
      - include: '#simple-capturing-group'
      - begin: \(\?
        end: \)
        name: invalid.illegal

  atomic-group:
    # https://github.com/slevithan/regex/tree/main#atomic-groups
    name: meta.group.regexplus
    begin: \(\?>
    end: \)
    captures:
      0: { name: punctuation.definition.group.regexp }
    patterns:
      - include: '#all'

  look-around:
    name: meta.group.regexplus
    begin: \(\?(?:=|!|<=|<!)
    end: \)
    captures:
      0: { name: punctuation.definition.group.regexp }
    patterns:
      - include: '#all'

  non-capturing-group:
    name: meta.group.regexplus
    begin: '\(\?:'
    end: \)
    captures:
      0: { name: punctuation.definition.group.regexp }
    patterns:
      - include: '#all'

  named-capturing-group:
    name: meta.group.regexplus
    begin: (\(\?<)([$_\p{IDS}][$\u200C\u200D\p{IDC}]*)?(>)
    beginCaptures:
      1: { name: punctuation.definition.group.regexp }
      2: { name: variable.other.constant.regexplus }
      3: { name: punctuation.definition.group.regexp }
    end: \)
    endCaptures:
      0: { name: punctuation.definition.group.regexp }
    patterns:
      - include: '#all'

  subroutine-definition-group:
    name: meta.group.regexplus
    begin: \(\?\((DEFINE)\)
    end: \)
    captures:
      0: { name: punctuation.definition.group.regexp }
      1: { name: support.function.regexp }
    patterns:
      - include: '#all'

  simple-capturing-group:
    name: meta.group.regexplus
    begin: \((?!\?)
    end: \)
    captures:
      0: { name: punctuation.definition.group.regexp }
    patterns:
      - include: '#all'

...
