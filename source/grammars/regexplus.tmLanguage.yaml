$schema: https://raw.githubusercontent.com/RedCMD/TmLanguage-Syntax-Highlighter/main/vscode.tmLanguage.schema.json
name: Regexp+
scopeName: text.regexplus

patterns:
  - include: '#all-rules'

repository:

  # These rules are common to .regex+ files and injections.
  shared-rules:
    patterns:
      - include: '#syntax-escape'
      - include: '#character-escape'
      - include: '#line-comment'
      - include: '#boundary-assertion'
      - include: '#disjunction'
      - include: '#wildcard'
      - include: '#quantifier-short'
      - include: '#character-class-escape'
      - include: '#backreference'
      - include: '#modifiers'

  # These are not.
  local-rules:
    patterns:
      - include: '#quantifier-min-max'
      - include: '#unicode-character-class-escape'
      - include: '#character-class'
      - include: '#group'

  all-rules:
    patterns:
      - include: '#shared-rules'
      - include: '#local-rules'
      - match: \S
        name: string.regexp

  syntax-escape:
    match: '(?x)\\ [ \\ \[ \] () {} # | ^ $ / ]'
    name: constant.character.escape.regexplus

  character-escape:
    patterns:
      - match: \\[fnrtv0]
        name: constant.character.escape.regexplus
      - match: \[\\b\]
        name: constant.character.escape.regexplus
      - match: \\c[a-zA-Z]
        name: constant.character.escape.regexplus
      - match: (\\x)([a-fA-F0-9]{2})
        captures:
          1: { name: constant.character.escape.regexplus }
          2: { name: constant.numeric.regexplus }
      - match: (\\u\{)([a-fA-F0-9]{1,6})(\})
        captures:
          1: { name: constant.character.escape.regexplus }
          2: { name: constant.numeric.regexplus }
          3: { name: constant.character.escape.regexplus }
      - match: (\\u)([a-fA-F0-9]{4})
        captures:
          1: { name: constant.character.escape.regexplus }
          2: { name: constant.numeric.regexplus }

  # https://github.com/slevithan/regex/tree/main#flag-x
  line-comment:
    begin: '#'
    end: $
    name: comment.line.number-sign.regexplus
    beginCaptures:
      0: { name: punctuation.definition.comment.regexplus }

  boundary-assertion:
    match: \^|\$|\\[bB]
    name: constant.language.regexplus

  disjunction:
    match: \|
    name: keyword.operator.or.regexp    # Same as TS/JS

  wildcard:
    match: \.
    name: keyword.operator.or.regexp    # Same as TS/JS's |

  # https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Regular_expressions/Quantifier
  # https://github.com/slevithan/regex/tree/main#possessive-quantifiers
  quantifier-short:
    patterns:
      - match: '[*?+][?+]?'
        name: meta.quantifier.regexplus
        captures:
          0: { name: keyword.operator.quantifier.regexp }   # Same as TS/JS

  quantifier-min-max:
    patterns:
      - begin: \{
        end: \}[?+]?
        name: meta.quantifier.regexplus
        captures:
          0: { name: keyword.operator.quantifier.regexp }   # Unfortunate, but same as TS/JS
        patterns:
          - include: '#quantifier-min-max-contents'
  quantifier-min-max-contents:
    patterns:
      - match: \d+
        name: constant.numeric.regexplus
      - match: ','
        name: keyword.operator.separator.regexplus
      - match: \S
        name: invalid.illegal.regexplus

  # https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Regular_expressions/Character_class_escape
  character-class-escape:
    match: \\[sSdDwW]
    name: support.class.regexplus

  # https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Regular_expressions/Unicode_character_class_escape
  unicode-character-class-escape:
    begin: \\[pP]\{
    end: \}
    name: support.class.regexplus
    contentName: string.regexp   # For themes that don't have support.constant
    patterns:
      - include: '#unicode-character-class-escape-contents'
  unicode-character-class-escape-contents:
    patterns:
      - match: \w+
        name: support.constant.regexplus
      - match: =
        name: keyword.operator.assignment.regexplus
      - match: \S
        name: invalid.illegal.regexplus

  # https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Regular_expressions/Backreference
  backreference:
    patterns:
      - match: \\[1-9]
        name: variable.other.regexplus
      - match: (\\k<)([$_\p{ID_Start}][$\u200C\u200D\p{ID_Continue}]*)?(>)
        captures:
          1: { name: keyword.other.regexplus }
          2: { name: variable.other.constant.regexplus }
          3: { name: keyword.other.regexplus }
      - match: (\\g<)([$_\p{ID_Start}][$\u200C\u200D\p{ID_Continue}]*)?(>)
        captures:
          1: { name: keyword.other.regexplus }
          2: { name: entity.name.function.regexplus }
          3: { name: keyword.other.regexplus }

  # https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Regular_expressions/Modifier
  modifiers:
    begin: \(\?(?=[-a-z])
    end: \)
    name: meta.group.modifiers.regexplus
    captures:
      0: { name: punctuation.definition.group.regexp }
    patterns:
      - match: '[-ims]+'
        name: constant.language.regexplus
      - match: \S
        name: invalid.illegal.regexplus

  # https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Regular_expressions/Character_class
  character-class:
    begin: \[\^?
    end: \]
    name: meta.character-class.regexplus
    contentName: string.regexp
    captures:
      0: { name: punctuation.definition.character-class.regexp }  # Same as TS/JS
    patterns:
      - include: '#character-class-contents'
  character-class-contents:
    patterns:
      - include: '#syntax-escape'
      - include: '#character-escape'
      - include: '#character-class-escape'
      - include: '#unicode-character-class-escape'
      - begin: \\q\{
        end: \}
        name: punctuation.definition.character-class.regexp
        contentName: string.regexp
        patterns:
          - include: '#syntax-escape'
          - include: '#character-escape'
          - include: '#disjunction'
      - match: --|&&
        name: keyword.operator.or.regexp    # Same as TS/JS's |
      - include: '#quantifier-short'
      - include: '#quantifier-min-max'
      - include: '#character-class'         # Recursive

  group:
    patterns:
      - include: '#atomic-group'
      - include: '#look-around'
      - include: '#non-capturing-group'
      - include: '#named-capturing-group'
      - include: '#subroutine-definition-group'
      - include: '#simple-capturing-group'
      - begin: \(\?
        end: \)
        name: invalid.illegal.regexplus

  # https://github.com/slevithan/regex/tree/main#atomic-groups
  atomic-group:
    name: meta.group.atomic.regexplus
    begin: \(\?>
    end: \)
    captures:
      0: { name: punctuation.definition.group.regexp }  # Same as JS/TS
    patterns:
      - include: '#all-rules'

  look-around:
    name: meta.group.look-around.regexplus
    begin: \(\?(?:=|!|<=|<!)
    end: \)|(?=\$|{)
    captures:
      0: { name: punctuation.definition.group.regexp }  # Same as JS/TS
    patterns:
      - include: '#all-rules'

  non-capturing-group:
    name: meta.group.no-capture.regexplus
    begin: '\(\?:'
    end: \)
    captures:
      0: { name: punctuation.definition.group.regexp }  # Same as JS/TS
    patterns:
      - include: '#all-rules'

  named-capturing-group:
    name: meta.group.named-capture.regexplus
    begin: (\(\?<)([$_\p{ID_Start}][$\u200C\u200D\p{ID_Continue}]*)?(>)
    beginCaptures:
      1: { name: punctuation.definition.group.regexp }  # Same as JS/TS
      2: { name: variable.other.constant.regexplus }
      3: { name: punctuation.definition.group.regexp }  # Same as JS/TS
    end: \)
    endCaptures:
      0: { name: punctuation.definition.group.regexp }  # Same as JS/TS
    patterns:
      - include: '#all-rules'

  subroutine-definition-group:
    name: meta.group.subroutine-definition.regexplus
    begin: \(\?\((DEFINE)\)
    end: \)
    captures:
      0: { name: punctuation.definition.group.regexp }  # Same as JS/TS
      1: { name: support.function.regexp }
    patterns:
      - include: '#all-rules'

  simple-capturing-group:
    name: meta.group.regexplus
    begin: \((?!\?)
    end: \)
    captures:
      0: { name: punctuation.definition.group.regexp }  # Same as JS/TS
    patterns:
      - include: '#all-rules'

...
