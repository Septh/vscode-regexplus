$schema: https://json.schemastore.org/tmlanguage.json
name: Regexp+
injectionSelector: L:source.$host-language$ -string.template.$host-language$

# yaml-language-server-disable
scopeName: text.embedded.$host-language$.regexplus

patterns:
  - begin: \b(regex)(`)
    end: (`)
    beginCaptures:
      1: { name: entity.name.function.tagged-template.$host-language$ }
      2: { name: string.template.$host-language$ punctuation.definition.string.template.begin.$host-language$ }
    endCaptures:
      1: { name: string.template.$host-language$ punctuation.definition.string.template.end.$host-language$ }
    contentName: string.template.$host-language$ meta.embedded.template.regexplus
    patterns:
      - include: source.$host-language$#template-substitution-element
      - include: text.regexplus

  - begin: (?x) \b(regex)(\() (?:(")([dgimsuvy]*)("))? (\))(`)
    end: (`)
    beginCaptures:
      1: { name: meta.function-call.$host-language$ entity.name.function.$host-language$ }
      2: { name: meta.brace.round.$host-language$ }
      3: { name: string.quoted.double.$host-language$ punctuation.definition.string.begin.$host-language$ }
      4: { name: string.quoted.double.$host-language$ constant.language.regexplus }
      5: { name: string.quoted.double.$host-language$ punctuation.definition.string.end.$host-language$ }
      6: { name: meta.brace.round.$host-language$ }
      7: { name: string.template.$host-language$ punctuation.definition.string.template.begin.$host-language$ }
    endCaptures:
      1: { name: string.template.$host-language$ punctuation.definition.string.template.end.$host-language$ }
    contentName: string.template.$host-language$ meta.embedded.template.regexplus
    patterns:
      - include: source.$host-language$#template-substitution-element
      - include: text.regexplus

  - begin: (?x) \b(regex)(\() (?:(')([dgimsuvy]*)('))? (\))(`)
    end: (`)
    beginCaptures:
      1: { name: meta.function-call.$host-language$ entity.name.function.$host-language$ }
      2: { name: meta.brace.round.$host-language$ }
      3: { name: string.quoted.single.$host-language$ punctuation.definition.string.begin.$host-language$ }
      4: { name: string.quoted.single.$host-language$ constant.language.regexplus }
      5: { name: string.quoted.single.$host-language$ punctuation.definition.string.end.$host-language$ }
      6: { name: meta.brace.round.$host-language$ }
      7: { name: string.template.$host-language$ punctuation.definition.string.template.begin.$host-language$ }
    endCaptures:
      1: { name: string.template.$host-language$ punctuation.definition.string.template.end.$host-language$ }
    contentName: string.template.$host-language$ meta.embedded.template.regexplus
    patterns:
      - include: source.$host-language$#template-substitution-element
      - include: text.regexplus

...
