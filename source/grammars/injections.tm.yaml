$schema: https://raw.githubusercontent.com/RedCMD/TmLanguage-Syntax-Highlighter/main/vscode.tmLanguage.schema.json
scopeName: text.embedded.HOST_LANGUAGE.regexplus
injectionSelector: L:source.HOST_LANGUAGE -comment -string.quoted

patterns:

  # regex`...`, pattern`...` (regular tagged template)
  - begin: \b(regex|pattern)\s*(`)
    end: (`)
    beginCaptures:
      1: { name: entity.name.function.tagged-template.HOST_LANGUAGE }
      2: { name: string.template.HOST_LANGUAGE punctuation.definition.string.template.begin.HOST_LANGUAGE }
    endCaptures:
      1: { name: string.template.HOST_LANGUAGE punctuation.definition.string.template.end.HOST_LANGUAGE }
    contentName: string.template.HOST_LANGUAGE meta.embedded.HOST_LANGUAGE.regexplus
    patterns:
      - include: '#injections'

  # regex('flags')`...` (function call, flags single quoted)
  - begin: (?x) \b(regex)\s* (\() (?:(') ([^']*) ('))? (\)) (`)
    end: (`)
    beginCaptures:
      1: { name: meta.function-call.HOST_LANGUAGE entity.name.function.HOST_LANGUAGE }
      2: { name: meta.brace.round.HOST_LANGUAGE }
      3: { name: string.quoted.single.HOST_LANGUAGE punctuation.definition.string.begin.HOST_LANGUAGE }
      # 4: { name: string.quoted.single.HOST_LANGUAGE }
      4:
        name: string.quoted.single.HOST_LANGUAGE
        patterns:
        - include: '#function-flags'
      5: { name: string.quoted.single.HOST_LANGUAGE punctuation.definition.string.end.HOST_LANGUAGE }
      6: { name: meta.brace.round.HOST_LANGUAGE }
      7: { name: string.template.HOST_LANGUAGE punctuation.definition.string.template.begin.HOST_LANGUAGE }
    endCaptures:
      1: { name: string.template.HOST_LANGUAGE punctuation.definition.string.template.end.HOST_LANGUAGE }
    contentName: string.template.HOST_LANGUAGE meta.embedded.HOST_LANGUAGE.regexplus
    patterns:
      - include: '#injections'

  # regex("flags")`...` (function call, flags double quoted)
  - begin: (?x) \b(regex)\s* (\() (") ([^"]*) (") (\)) (`)
    end: (`)
    beginCaptures:
      1: { name: meta.function-call.HOST_LANGUAGE entity.name.function.HOST_LANGUAGE }
      2: { name: meta.brace.round.HOST_LANGUAGE }
      3: { name: string.quoted.double.HOST_LANGUAGE punctuation.definition.string.begin.HOST_LANGUAGE }
      # 4: { name: string.quoted.double.HOST_LANGUAGE }
      4:
        name: string.quoted.double.HOST_LANGUAGE
        patterns:
        - include: '#function-flags'
      5: { name: string.quoted.double.HOST_LANGUAGE punctuation.definition.string.end.HOST_LANGUAGE }
      6: { name: meta.brace.round.HOST_LANGUAGE }
      7: { name: string.template.HOST_LANGUAGE punctuation.definition.string.template.begin.HOST_LANGUAGE }
    endCaptures:
      1: { name: string.template.HOST_LANGUAGE punctuation.definition.string.template.end.HOST_LANGUAGE }
    contentName: string.template.HOST_LANGUAGE meta.embedded.HOST_LANGUAGE.regexplus
    patterns:
      - include: '#injections'

  # /* regex */`...` (comment prefix)
  - begin: (\/\*)(\s*regex\s*)(\*\/)\s*(`)
    end: (`)
    beginCaptures:
      1: { name: comment.block.HOST_LANGUAGE punctuation.definition.comment.HOST_LANGUAGE }
      2: { name: comment.block.HOST_LANGUAGE }
      3: { name: comment.block.HOST_LANGUAGE punctuation.definition.comment.HOST_LANGUAGE }
      4: { name: string.template.HOST_LANGUAGE punctuation.definition.string.template.begin.HOST_LANGUAGE }
    endCaptures:
      1: { name: string.template.HOST_LANGUAGE punctuation.definition.string.template.end.HOST_LANGUAGE }
    contentName: string.template.HOST_LANGUAGE meta.embedded.HOST_LANGUAGE.regexplus
    patterns:
      - include: '#injections'

  # `#regex ...` (embedded start comment)
  - begin: (`)(?=\s*#\s*regex)
    end: (`)
    beginCaptures:
      1: { name: string.template.HOST_LANGUAGE punctuation.definition.string.template.begin.HOST_LANGUAGE }
    endCaptures:
      1: { name: string.template.HOST_LANGUAGE punctuation.definition.string.template.end.HOST_LANGUAGE }
    contentName: string.template.HOST_LANGUAGE meta.embedded.HOST_LANGUAGE.regexplus
    patterns:
      - include: '#injections'

repository:
  function-flags:
    patterns:
    - match: ([dgmsy]+)
      name: constant.language.regexplus
    - match: \S
      name: invalid.illegal.regexplus

  injections:
    patterns:
      - include: '#host-language-stuff'
      - include: text.regexplus#shared-rules
      # When injecting Regex+, we use a few local, custom rules
      # rather than those defined in the main language file.
      - include: '#injected-modifiers'
      - include: '#injected-quantifier-min-max'
      - include: '#injected-unicode-character-class-escape'
      - include: '#injected-character-class'
      - include: '#injected-group'
      - match: \S
        name: string.regexp

  host-language-stuff:
    patterns:
      # Allow ${...} substitution in template string
      - include: source.HOST_LANGUAGE#template-substitution-element
      # Catch escaped backticks
      - match: \\`
        name: constant.character.escape.regexplus

  injected-modifiers:
    begin: \(\?(?=[-a-z])
    end: \)|(?=`)
    name: meta.group.modifiers.regexplus
    captures:
      0: { name: punctuation.definition.group.regexp }
    patterns:
      - include: '#host-language-stuff'
      - include: 'text.regexplus#modifiers-contents'

  injected-quantifier-min-max:
    patterns:
      - begin: \{
        end: (\}[?+]?)|(?=`)
        name: meta.quantifier.regexplus
        captures:
          0: { name: keyword.operator.quantifier.regexp }   # Same as TS/JS
        patterns:
          - include: '#host-language-stuff'
          - include: text.regexplus#quantifier-min-max-contents

  injected-unicode-character-class-escape:
    begin: \\[pP]\{
    end: \}|(?=`)
    name: support.class.regexplus
    contentName: string.regexp   # For themes that don't have support.constant
    patterns:
      - include: '#host-language-stuff'
      - include: text.regexplus#unicode-character-class-escape-contents

  injected-character-class:
    begin: \[\^?
    end: \]|(?=`)
    name: meta.character-class.regexplus
    captures:
      0: { name: punctuation.definition.character-class.regexp }  # Same as TS/JS
    patterns:
      - include: '#host-language-stuff'
      - include: text.regexplus#character-class-contents

  injected-group:
    patterns:
      - include: '#injected-atomic-group'
      - include: '#injected-look-around'
      - include: '#injected-non-capturing-group'
      - include: '#injected-named-capturing-group'
      - include: '#injected-subroutine-definition-group'
      - include: '#injected-simple-capturing-group'
      - begin: \(\s*\?
        end: \)|(?=`)
        name: invalid.illegal.regexplus

  injected-atomic-group:
    name: meta.group.atomic.regexplus
    begin: \(\?>
    end: \)|(?=`)
    captures:
      0: { name: punctuation.definition.group.regexp }  # Same as JS/TS
    patterns:
      - include: '#injections'

  injected-look-around:
    name: meta.group.look-around.regexplus
    begin: (?x) \(\? <?[=!]
    end: \)|(?=`)
    captures:
      0: { name: punctuation.definition.group.regexp }  # Same as JS/TS
    patterns:
      - include: '#injections'

  injected-non-capturing-group:
    name: meta.group.non-capturing.regexplus
    begin: '\(\?:'
    end: \)|(?=`)
    captures:
      0: { name: punctuation.definition.group.regexp }  # Same as JS/TS
    patterns:
      - include: '#injections'

  injected-named-capturing-group:
    name: meta.group.capturing.regexplus
    begin: (\(\?<)([$_\p{ID_Start}][$\u200C\u200D\p{ID_Continue}]*)?(>)
    beginCaptures:
      1: { name: punctuation.definition.group.regexp }  # Same as JS/TS
      2: { name: variable.other.constant.regexplus }
      3: { name: punctuation.definition.group.regexp }  # Same as JS/TS
    end: \)|(?=`)
    endCaptures:
      0: { name: punctuation.definition.group.regexp }  # Same as JS/TS
    patterns:
      - include: '#injections'

  injected-subroutine-definition-group:
    name: meta.group.regexplus
    begin: \(\?\((DEFINE)\)
    end: \)|(?=`)
    captures:
      0: { name: punctuation.definition.group.regexp }  # Same as JS/TS
      1: { name: support.function.regexp }
    patterns:
      - include: '#injections'

  injected-simple-capturing-group:
    name: meta.group.regexplus
    begin: \((?!\?)
    end: \)|(?=`)
    captures:
      0: { name: punctuation.definition.group.regexp }  # Same as JS/TS
    patterns:
      - include: '#injections'

...
