$schema: https://raw.githubusercontent.com/RedCMD/TmLanguage-Syntax-Highlighter/main/vscode.tmLanguage.schema.json
scopeName: text.embedded.HOST_LANGUAGE.regexplus
injectionSelector: L:source.HOST_LANGUAGE -comment -(string -quoted) -meta.embedded

patterns:

  # regex`...` or pattern`...` (regular tagged template, maybe preceded by a name in case someone does `import * as X from 'regex'`)
  - begin: (?x) (?:\b(\w+)\s*(\.))? \b(regex|pattern)\s* (`)
    end: (`)
    contentName: string.template.HOST_LANGUAGE meta.embedded.text.regexplus
    beginCaptures:
      1: { name: variable.other.object.HOST_LANGUAGE }
      2: { name: punctuation.accessor.HOST_LANGUAGE}
      3: { name: entity.name.function.tagged-template.HOST_LANGUAGE }
      4: { name: string.template.HOST_LANGUAGE punctuation.definition.string.template.begin.HOST_LANGUAGE }
    endCaptures:
      1: { name: string.template.HOST_LANGUAGE punctuation.definition.string.template.end.HOST_LANGUAGE }
    patterns:
      - include: '#injections'

  # regex('flags')`...` (function call with (single|double|backtick)-quoted flags, maybe preceded by a name)
  - begin: (?x) (?:\b(\w+)\s*(\.))? \b(regex) \s*(\()\s* (?:(["'\`]) (.*?) (\5))? \s*(\))\s* (`)
    end: (`)
    contentName: string.template.HOST_LANGUAGE meta.embedded.text.regexplus
    beginCaptures:
      1: { name: variable.other.object.HOST_LANGUAGE }
      2: { name: punctuation.accessor.HOST_LANGUAGE}
      3: { name: meta.function-call.HOST_LANGUAGE entity.name.function.HOST_LANGUAGE }
      4: { name: meta.brace.round.HOST_LANGUAGE }
      5: { name: string.quoted.single.HOST_LANGUAGE punctuation.definition.string.begin.HOST_LANGUAGE }
      6:
        name: string.quoted.single.HOST_LANGUAGE
        patterns:
        - match: ([dgimsuvy]+)  # cSpell:disable-line
          name: constant.language.regexplus
        - match: \S
          name: invalid.illegal.regexplus
      7: { name: string.quoted.single.HOST_LANGUAGE punctuation.definition.string.end.HOST_LANGUAGE }
      8: { name: meta.brace.round.HOST_LANGUAGE }
      9: { name: string.template.HOST_LANGUAGE punctuation.definition.string.template.begin.HOST_LANGUAGE }
    endCaptures:
      1: { name: string.template.HOST_LANGUAGE punctuation.definition.string.template.end.HOST_LANGUAGE }
    patterns:
      - include: '#injections'

  # /* regex */`...` (comment prefix)
  - begin: (\/\*)(\s*regex\s*)(\*\/)\s*(`)
    end: (`)
    contentName: string.template.HOST_LANGUAGE meta.embedded.text.regexplus
    beginCaptures:
      1: { name: comment.block.HOST_LANGUAGE punctuation.definition.comment.HOST_LANGUAGE }
      2: { name: comment.block.HOST_LANGUAGE }
      3: { name: comment.block.HOST_LANGUAGE punctuation.definition.comment.HOST_LANGUAGE }
      4: { name: string.template.HOST_LANGUAGE punctuation.definition.string.template.begin.HOST_LANGUAGE }
    endCaptures:
      1: { name: string.template.HOST_LANGUAGE punctuation.definition.string.template.end.HOST_LANGUAGE }
    patterns:
      - include: '#injections'

  # `#regex ...` (embedded start comment, maybe preceded by a tag expression)
  - begin: (?x) (?:\b(\w+)\s*(\.))? (?:\b(\w+)\s*(\.))? (?:\b(\w+)\s*(\.))? (?:\b(\w+)\s*(\.))? (?:\b(\w+)\s*)? (`)(?=\s*\#\s*r[ex])
    end: (`)
    contentName: string.template.HOST_LANGUAGE meta.embedded.text.regexplus
    beginCaptures:
      1: { name: variable.other.object.HOST_LANGUAGE }
      2: { name: punctuation.accessor.HOST_LANGUAGE}
      3: { name: variable.other.object.property.HOST_LANGUAGE }
      4: { name: punctuation.accessor.HOST_LANGUAGE}
      5: { name: variable.other.object.property.HOST_LANGUAGE }
      6: { name: punctuation.accessor.HOST_LANGUAGE}
      7: { name: variable.other.object.property.HOST_LANGUAGE }
      8: { name: punctuation.accessor.HOST_LANGUAGE}
      9: { name: entity.name.function.tagged-template.HOST_LANGUAGE }
      10: { name: string.template.HOST_LANGUAGE punctuation.definition.string.template.begin.HOST_LANGUAGE }
    endCaptures:
      1: { name: string.template.HOST_LANGUAGE punctuation.definition.string.template.end.HOST_LANGUAGE }
    patterns:
      - include: '#injections'

repository:

  injections:
    patterns:
      - include: '#line-comment'
      - include: '#host-language-stuff'
      - include: 'text.regexplus#shared-rules'
      - include: '#local-rules'
      - include: 'text.regexplus#literal'

  local-rules:
    patterns:
      - include: '#back-reference-name'
      - include: '#quantifier-range'
      - include: '#local-escapes'
      - include: '#character-class'
      - include: '#group-like'
  local-escapes:
    patterns:
      - include: '#hex-6-escape'
      - include: '#unicode-escape'
      - include: '#substring-escape'

  # ${...} substitutions and escaped backticks
  host-language-stuff:
    patterns:
      - include: source.HOST_LANGUAGE#template-substitution-element
      - match: \\`
        name: constant.character.escape.regexplus

  line-comment:
    begin: (?<!\\)#
    end: $|(?=(?<!\\)(?:\$\{|`))
    name: comment.line.number-sign.regexplus
    beginCaptures:
      0: { name: punctuation.definition.comment.regexplus }
    patterns:
      # Catch escaped backticks in comments
      - match: \\`

  hex-6-escape:
    begin: (?<!\\)(\\u\{)
    end: (?<!\\)(\})|(?=(?<!\\)`)|$
    captures:
      1: { name: constant.character.escape.hex6.regexplus }
    patterns:
      - include: '#host-language-stuff'
      - include: 'text.regexplus#hex-6-escape-contents'

  unicode-escape:
    begin: (?<!\\)(\\[pP]\{)
    end: (?<!\\)(\})|(?=(?<!\\)`)|$
    captures:
      1: { name: support.class.regexplus }
    contentName: string.regexp
    patterns:
      - include: '#host-language-stuff'
      - include: 'text.regexplus#unicode-escape-contents'

  substring-escape:
    begin: (?<!\\)(\\q\{)
    end: (?<!\\)(\})|(?=(?<!\\)`)|$
    name: string.character-class.substring.regexplus
    beginCaptures:
      1: { name: string.character-class.substring.begin.regexplus }
    endCaptures:
      1: { name: string.character-class.substring.end.regexplus }
    patterns:
      - include: '#host-language-stuff'
      - include: 'text.regexplus#substring-escape-contents'
      - include: '#local-escapes'
  in-class-substring-escape:
    begin: (?<!\\)(\\q\{)
    end: (?<!\\)(\})|(?=(?<!\\)[\]`])|$
    name: string.character-class.substring.regexplus
    beginCaptures:
      1: { name: string.character-class.substring.begin.regexplus }
    endCaptures:
      1: { name: string.character-class.substring.end.regexplus }
    patterns:
      - include: '#host-language-stuff'
      - include: 'text.regexplus#substring-escape-contents'
      - include: '#local-escapes'

  back-reference-name:
    patterns:
      - begin: (?<!\\)(\\g<)
        end: (?<!\\)(>)|(?=(?<!\\)`)|$
        captures:
          1: { name: keyword.other.regexplus }
        patterns:
          - include: '#host-language-stuff'
          - include: 'text.regexplus#back-reference-subroutine-contents'
      - begin: (?<!\\)(\\k<)
        end: (?<!\\)(>)|(?=(?<!\\)`)|$
        captures:
          1: { name: keyword.other.regexplus }
        patterns:
          - include: '#host-language-stuff'
          - include: 'text.regexplus#back-reference-name-contents'

  quantifier-range:
    patterns:
      - begin: (?<!\\[pPqu])(\{)
        end: (?<!\\)(}[?+]?)|(?=(?<!\\)`)|$
        name: meta.quantifier.regexplus
        captures:
          1: { name: keyword.operator.quantifier.regexp }   # Same as TS/JS
        patterns:
          - include: '#host-language-stuff'
          - include: 'text.regexplus#quantifier-range-contents'

  character-class:
    begin: (?<!\\)(\[)(\^?)
    end: (?<!\\)(\])|(?=(?<!\\)`)
    name: meta.character-class.regexplus
    captures:
      1: { name: punctuation.definition.character-class.regexp }    # Same as TS/JS
      2: { name: keyword.operator.negation.regexp }                 # Same as TS/JS
    patterns:
      - include: '#host-language-stuff'
      - include: '#character-class'
      - include: '#in-class-substring-escape'
      - include: '#local-escapes'
      - include: 'text.regexplus#character-class-contents'

  group-like:
    patterns:
      - include: '#inline-flags-modifiers'
      - include: '#look-around'
      - include: '#atomic-group'
      - include: '#non-capturing-group'
      - include: '#named-capturing-group'
      - include: '#subroutine-definition-group'
      - include: '#simple-capturing-group'
      - include: 'text.regexplus#group-literal'

  inline-flags-modifiers:
    begin: (?<!\\)(\(\?)(?=[ims-])
    end: (?<!\\)(\))|(?=(?<!\\)`)
    name: meta.group.inline-flags.regexplus
    captures:
      0: { name: punctuation.definition.group.regexp }
    patterns:
      - include: '#host-language-stuff'
      - include: 'text.regexplus#inline-flags-modifiers-contents'
      - begin: (?<!\\)(:)
        end: (?=(?<!\\)[)`])
        beginCaptures:
          1: { name: keyword.operator.separator.regexplus }
        patterns:
          - include: '#injections'

  look-around:
    begin: (?<!\\)(\(\?<?[=!])
    end: (?<!\\)(\))|(?=(?<!\\)`)
    name: meta.group.look-around.regexplus
    captures:
      1: { name: punctuation.definition.group.regexp }  # Same as JS/TS
    patterns:
      - include: '#injections'

  atomic-group:
    begin: (?<!\\)(\(\?>)
    end: (?<!\\)(\))|(?=(?<!\\)`)
    name: meta.group.atomic.regexplus
    captures:
      1: { name: punctuation.definition.group.regexp }  # Same as JS/TS
    patterns:
      - include: '#injections'

  non-capturing-group:
    begin: (?<!\\)(\(\?:)
    end: (?<!\\)(\))|(?=(?<!\\)`)
    name: meta.group.no-capture.regexplus
    captures:
      1: { name: punctuation.definition.group.regexp }  # Same as JS/TS
    patterns:
      - include: '#injections'

  named-capturing-group:
    begin: (?<!\\)(\(\?<)(?![=!])
    end: (?<!\\)(\))|(?=(?<!\\)`)
    name: meta.group.named-capture.regexplus
    captures:
      1: { name: punctuation.definition.group.regexp }  # Same as JS/TS
    patterns:
      - include: '#host-language-stuff'
      - include: 'text.regexplus#named-capturing-group-contents'
      - begin: (?<!\\)(>)
        end: (?=(?<!\\)[)`])
        beginCaptures:
          1: { name: punctuation.definition.group.regexp }
        patterns:
          - include: '#injections'

  subroutine-definition-group:
    begin: (?<!\\)(\(\?\((DEFINE)\))
    end: (?<!\\)(\))|(?=(?<!\\)`)
    name: meta.group.subroutine-definition.regexplus
    captures:
      1: { name: punctuation.definition.group.regexp }  # Same as JS/TS
      2: { name: support.function.regexp }
    patterns:
      - include: '#injections'

  simple-capturing-group:
    begin: (?<!\\)(\()(?:(\?(?![=!<>:ims-]))?)
    end: (?<!\\)(\))|(?=(?<!\\)`)
    name: meta.group.regexplus
    captures:
      1: { name: punctuation.definition.group.regexp }  # Same as JS/TS
      2: { name: keyword.operator.quantifier.regexp }  # Same as JS/TS
    patterns:
      - include: '#injections'

...
